<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Şahin Emlak - Satılık ve kiralık gayrimenkul ilanları, güvenilir ve profesyonel emlak danışmanlığı."
    />
    <title>Şahin Emlak | Güvenilir Gayrimenkul Danışmanlığı</title>
    <!--
      Admin paneli koyu (brand-navy) bir temada — ama JS henüz yüklenip React
      hiçbir şey çizmeden önce, tarayıcı varsayılan olarak BEYAZ bir sayfa
      gösterir (canlıda yenilemede rahatsız edici bir "beyaz an" olarak
      fark edildi). Bu senkron script, JS bundle'ı inmeden, React hiçbir şey
      çizmeden HEMEN (HTML parse sırasında, ilk boyamadan önce) çalışır —
      sadece /admin yolları için arka planı koyu yapar, böylece o boşluk
      anında da beyaz hiç görünmez. Public site (açık temalı) sayfaları
      etkilenmez, kendi varsayılan (beyaz) arka planında kalır.
    -->
    <script>
      if (location.pathname.startsWith("/admin")) {
        document.documentElement.style.backgroundColor = "#0e1b2c";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
